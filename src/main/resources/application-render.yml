# Standalone deployment profile. Render terminates HTTPS at its reverse proxy.
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  shutdown: graceful
spring:
  liquibase:
    # Only the migration session may bootstrap tables before migration 009 adds keys.
    url: ${LIQUIBASE_DB_URL:${spring.datasource.url}&sessionVariables=sql_require_primary_key=0}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:mysql-ehs-kbnalpha-bbce.l.aivencloud.com}:${DB_PORT:15129}/${DB_NAME:ehs_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&sslMode=REQUIRED&connectTimeout=10000&socketTimeout=30000}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:bbd299001@smtp-brevo.com}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    user:
      name: ${API_USERNAME:ehs-api}
      password: ${API_PASSWORD}
ehs:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${SMTP_FROM:kbnalpha@gmail.com}

logging:
  level:
    com.ehspro.config.DeploymentDiagnostics: DEBUG
