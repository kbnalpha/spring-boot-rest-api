# Activate together with mysql. Render terminates HTTPS at its reverse proxy.
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    user:
      name: ${API_USERNAME}
      password: ${API_PASSWORD}
