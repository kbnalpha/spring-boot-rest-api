spring:
  config:
    import: optional:file:./.env[.properties]
  liquibase:
    # Only the migration session may bootstrap tables before migration 009 adds keys.
    url: ${LIQUIBASE_DB_URL:${spring.datasource.url}&sessionVariables=sql_require_primary_key=0}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:mysql-ehs-kbnalpha-bbce.l.aivencloud.com}:${DB_PORT:15129}/${DB_NAME:ehs_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&sslMode=REQUIRED&connectTimeout=10000&socketTimeout=30000}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  security:
    user:
      name: ${API_USERNAME:ehs-api}
      password: ${API_PASSWORD:ehs-api-local}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
